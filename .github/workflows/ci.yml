name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values (they're inlined into the site's JS anyway). No secrets are needed to build.
  NEXT_PUBLIC_PHOTO_STORAGE: supabase
  NEXT_PUBLIC_SUPABASE_URL: https://fstcgdirhssuaevgxptv.supabase.co
  NEXT_TELEMETRY_DISABLED: 1
  HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the store contract on Drizzle (src/lib/store/__tests__/postgres.test.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailnotes_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No real guide is in the repo (they're in the database): everything here runs on fixtures/.
      - name: Fixture guides pass the save gate
        run: pnpm content check
        env:
          CONTENT_DIR: fixtures/hikes
      - run: pnpm lint
      - name: Typecheck (next typegen + tsc)
        run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailnotes_test
      - name: Build as production does (photos from Supabase)
        run: pnpm build
        env:
          CONTENT_DIR: fixtures/hikes
      # `pnpm e2e` builds again, on a copy of the fixture guides with their photos on disk, then
      # runs a visitor against that build (nobody is an editor there) and the editor on a dev
      # server, where it is a local owner. Neither can reach the database or the bucket.
      - name: Browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      # Guides in the database aren't covered by a build: a code change (a renamed prop, a stricter
      # rule) could break one without anything failing. This runs the save gate over every stored
      # guide, read-only. It needs the DATABASE_URL repository secret and is skipped without it (and
      # on pull requests from forks, which never receive secrets).
      - name: Stored guides pass the save gate
        if: ${{ env.HAS_DATABASE_URL == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm content check --store postgres
