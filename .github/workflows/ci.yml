name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values (they're inlined into the site's JS anyway). No secrets are needed to build.
  NEXT_PUBLIC_PHOTO_STORAGE: supabase
  NEXT_PUBLIC_SUPABASE_URL: https://fstcgdirhssuaevgxptv.supabase.co
  NEXT_TELEMETRY_DISABLED: 1
  HAS_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the store contract on Drizzle (src/lib/store/__tests__/postgres.test.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailnotes_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guides in content/ pass the save gate
        run: pnpm content check
      - run: pnpm lint
      - name: Typecheck (next typegen + tsc)
        run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailnotes_test
      - name: Photos referenced by content exist in Supabase
        run: pnpm photos check
      - run: pnpm build
      # Guides in the database aren't covered by a build: a code change (a renamed prop, a stricter
      # rule) could break one without anything failing. This runs the save gate over every stored
      # guide, read-only. It needs the SUPABASE_SERVICE_ROLE_KEY repository secret and is skipped
      # without it (and on pull requests from forks, which never receive secrets).
      - name: Stored guides pass the save gate
        if: ${{ env.HAS_SERVICE_KEY == 'true' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm content check --store supabase
